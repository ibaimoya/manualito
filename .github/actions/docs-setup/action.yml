name: Preparar docs
description: Instala pnpm (versión del packageManager), Node con cache de pnpm y las dependencias del site de docs.

runs:
  using: composite
  steps:
    - name: Cargar versiones
      id: versions
      shell: bash
      run: |
        . ./.env
        echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

    - name: Instalar pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        # La versión sale del campo packageManager de docs/site/package.json.
        package_json_file: docs/site/package.json

    - name: Configurar Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ steps.versions.outputs.node_version }}
        cache: pnpm
        cache-dependency-path: docs/site/pnpm-lock.yaml

    - name: Instalar dependencias
      shell: bash
      working-directory: docs/site
      run: pnpm install --frozen-lockfile
