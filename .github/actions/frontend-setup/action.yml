name: Preparar frontend
description: Instala pnpm (versión del packageManager), Node con cache de pnpm y las dependencias del frontend.

runs:
  using: composite
  steps:
    - name: Cargar versiones
      id: versions
      shell: bash
      run: |
        . ./.env
        echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

    - name: Preparar pnpm y Node
      uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
      with:
        # La versión sale del campo packageManager de frontend/package.json.
        package-json-file: frontend/package.json
        runtime: node@${{ steps.versions.outputs.node_version }}
        cache: true
        cache-dependency-path: frontend/pnpm-lock.yaml
        install: false

    - name: Instalar dependencias
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
