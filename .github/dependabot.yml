# Mantiene al día los SHAs de las actions (workflows y composite actions).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: friday
      time: "08:00"
      timezone: Europe/Madrid
    # Cuarentena anti supply-chain, no propone versiones recién publicadas.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci-cd
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
