# CI del repositorio:
#  - setup compartido en .github/actions/
#  - Versiones desde .env.

name: CI

on:
  push:
    branches: ["master", "staging", "development"]
  pull_request:
    branches: ["master", "staging", "development"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preparar backend
        uses: ./.github/actions/backend-setup

      - name: Comprobar lint con Ruff
        run: uv run --no-sync ruff check backend scripts --output-format=github

  backend-typecheck:
    name: Backend - Tipos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preparar backend
        uses: ./.github/actions/backend-setup
        with:
          dependency-group: typecheck

      - name: Comprobar tipos con mypy
        run: uv run --no-sync mypy

  backend-tests:
    name: Backend - Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preparar backend
        uses: ./.github/actions/backend-setup

      - name: Ejecutar tests
        run: >-
          uv run --no-sync pytest -v backend/tests scripts/hooks/tests
          --cov=backend --cov=scripts/hooks --cov-report=xml:coverage.xml
          --junitxml=pytest-report.xml

      - name: Guardar reportes de tests y cobertura
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-reports
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: error
          retention-days: 7

  backend-migrations:
    name: Backend - Migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgresql+psycopg://manualito@localhost:5432/manualito

    services:
      postgres:
        # No puede leer el .env; el paso de deriva falla si no coincide con él.
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_DB: manualito
          POSTGRES_USER: manualito
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manualito -d manualito"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Comprobar deriva de la imagen de postgres
        env:
          SERVICE_IMAGE: postgres:18.4-alpine3.23
        run: |
          . ./.env
          expected="postgres:${POSTGRES_VERSION}-${POSTGRES_VARIANT}"
          if [ "$SERVICE_IMAGE" != "$expected" ]; then
            echo "::error::El service usa $SERVICE_IMAGE pero el .env declara $expected. Actualiza services.postgres.image y SERVICE_IMAGE."
            exit 1
          fi

      - name: Preparar backend
        uses: ./.github/actions/backend-setup

      - name: Aplicar migraciones
        run: uv run --no-sync alembic -c backend/database/alembic.ini upgrade head

      - name: Comprobar migraciones pendientes
        run: uv run --no-sync alembic -c backend/database/alembic.ini check

  frontend-static:
    name: Frontend - Estático
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preparar frontend
        uses: ./.github/actions/frontend-setup

      - name: Generar route tree
        run: pnpm routes:generate

      - name: ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  frontend-tests:
    name: Frontend - Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preparar frontend
        uses: ./.github/actions/frontend-setup

      - name: Generar route tree
        run: pnpm routes:generate

      - name: Tests con cobertura
        run: pnpm test:coverage

      - name: Guardar cobertura del frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preparar frontend
        uses: ./.github/actions/frontend-setup

      - name: Generar route tree
        run: pnpm routes:generate

      - name: Build de producción
        run: pnpm build

      - name: Guardar bundle de producción
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  frontend-audit:
    name: Frontend - Auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CVEs high+ visibles en el PR sin llegar a bloquear.
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preparar frontend
        uses: ./.github/actions/frontend-setup

      - name: Auditar vulnerabilidades (high+critical)
        run: pnpm audit --audit-level=high --prod

  sonarqube:
    name: Calidad - SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # El plan gratuito de SonarQube Cloud solo analiza master y pull requests.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    needs: [backend-typecheck, backend-tests, backend-migrations, frontend-tests]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Descargar reportes de tests del backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-and-coverage-reports

      - name: Descargar cobertura del frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true

      - name: Comprobar token de SonarQube Cloud
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SONAR_TOKEN. Create it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true
