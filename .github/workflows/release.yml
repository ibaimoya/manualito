# Publica la GitHub Release de un tag SemVer; la lógica vive en .github/scripts/release/.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar, por ejemplo v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release - Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_NAME: Manualito
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolver release
        id: release
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: bash .github/scripts/release/resolve_tag.sh

      - name: Comprobar rama principal y fijar tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: bash .github/scripts/release/check_ancestor.sh

      - name: Comprobar versiones del proyecto
        env:
          PROJECT_VERSION: ${{ steps.release.outputs.project_version }}
        run: python .github/scripts/release/check_versions.py

      - name: Preparar notas de release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/scripts/release/extract_changelog.sh

      - name: Calcular checksums de archivos fuente
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: bash .github/scripts/release/build_archives.sh

      - name: Crear release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
        run: bash .github/scripts/release/create_release.sh
