<!DOCTYPE html>
<html lang="$locale">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <title>$title</title>
    <style>
      @media only screen and (max-width: 600px) {
        .email-spacing {
          padding: 32px 24px !important;
        }

        .email-heading {
          font-size: 32px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fff8f0;
      color: #1f1611;
      -webkit-text-size-adjust: 100%;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        mso-hide: all;
        font-size: 1px;
        line-height: 1px;
        color: #fff8f0;
      "
    >
      $preheader
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        width: 100%;
        background-color: #fff8f0;
      "
    >
      <tr>
        <td class="email-spacing" align="center" style="padding: 48px 32px;">
          <!--[if mso]>
          <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td>
          <![endif]-->
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 520px;
              table-layout: fixed;
            "
          >
            <tr>
              <td
                style="
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, Helvetica, Arial, sans-serif;
                "
              >
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      style="
                        padding-right: 10px;
                        vertical-align: middle;
                      "
                    >
                      <img
                        src="cid:manualito-logo"
                        width="40"
                        height="40"
                        alt=""
                        style="
                          display: block;
                          width: 40px;
                          height: 40px;
                          border: 0;
                        "
                      >
                    </td>
                    <td
                      style="
                        vertical-align: middle;
                        font-size: 24px;
                        line-height: 28px;
                        font-weight: 700;
                        letter-spacing: -0.5px;
                        color: #1f1611;
                      "
                    >
                      Manualito<span style="color: #e07a1f;">.</span>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 44px 0 10px;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #6e5b4d;
                    overflow-wrap: anywhere;
                  "
                >
                  $greeting
                </p>
                <h1
                  class="email-heading"
                  style="
                    margin: 0 0 20px;
                    font-size: 38px;
                    line-height: 1.12;
                    font-weight: 700;
                    letter-spacing: -1.1px;
                    color: #1f1611;
                  "
                >
                  $heading
                </h1>
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #5c4a3e;
                  "
                >
                  $intro
                </p>

                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#a6411d"
                      style="border-radius: 12px;"
                    >
                      <a
                        href="$action_url"
                        target="_blank"
                        style="
                          display: inline-block;
                          border: 1px solid #a6411d;
                          border-radius: 12px;
                          padding: 15px 24px;
                          font-size: 16px;
                          line-height: 20px;
                          font-weight: 700;
                          color: #fff8f0;
                          text-decoration: none;
                          mso-padding-alt: 0;
                        "
                      >
                        <!--[if mso]>
                        <i
                          style="
                            mso-font-width: 150%;
                            mso-text-raise: 21pt;
                          "
                          hidden
                        >&emsp;</i>
                        <span style="mso-text-raise: 10.5pt;">
                        <![endif]-->
                        $action_label
                        <!--[if mso]>
                        </span>
                        <i style="mso-font-width: 150%;" hidden>&emsp;&#8203;</i>
                        <![endif]-->
                      </a>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 12px 0 0;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #6e5b4d;
                  "
                >
                  $expiry_note
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding-top: 32px;">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      style="
                        border-top: 1px solid #dfd2c4;
                        padding-top: 24px;
                        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                          Roboto, Helvetica, Arial, sans-serif;
                      "
                    >
                      <p
                        style="
                          margin: 0 0 18px;
                          font-size: 14px;
                          line-height: 1.6;
                          color: #6e5b4d;
                        "
                      >
                        $ignore_note
                      </p>
                      <p
                        style="
                          margin: 0 0 6px;
                          font-size: 13px;
                          line-height: 1.6;
                          color: #6e5b4d;
                        "
                      >
                        $fallback_note
                      </p>
                      <p
                        style="
                          margin: 0;
                          font-size: 12px;
                          line-height: 1.6;
                          word-break: break-all;
                          overflow-wrap: anywhere;
                        "
                      >
                        <a
                          href="$action_url"
                          target="_blank"
                          style="
                            color: #2c6e91;
                            text-decoration: underline;
                            word-break: break-all;
                          "
                        >
                          $action_url
                        </a>
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!--[if mso]>
              </td>
            </tr>
          </table>
          <![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
