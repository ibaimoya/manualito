<svg font-family="Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 40 760 472" role="img" aria-labelledby="ramas-title ramas-desc">
<title id="ramas-title">De una tarea a la versión estable de Manualito</title>
<desc id="ramas-desc">Ejemplo ilustrativo de ramas por entorno. Una tarea parte de development, se desarrolla por separado y vuelve a integrarse allí. La versión pasa a staging para probarse en otro equipo y después a master. Los puntos representan commits y las conexiones entre líneas representan la creación de una rama o la integración de cambios. El espaciado indica orden, no duración. La figura no representa despliegues automáticos.</desc>
